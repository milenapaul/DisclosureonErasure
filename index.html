// Soft ink + grain
function drawInkChar(char, x, y) {
  ctx.save();
  ctx.shadowColor = "rgba(255,255,255,0.35)";
  ctx.shadowBlur = 1.2;

  for (let i = 0; i < 3; i++) {
    const ox = (Math.random() - 0.5) * 0.6;
    const oy = (Math.random() - 0.5) * 0.6;
    ctx.fillText(char, x + ox, y + oy);
  }
  ctx.restore();

  const w = ctx.measureText(char).width + 4;
  const h = 30;
  const img = ctx.getImageData(x - 2, y - 24, w, h);
  const data = img.data;
  for (let i = 0; i < data.length; i += 4) {
    if (data[i + 3] > 0) {
      const grain = (Math.random() - 0.5) * 25;
      data[i] += grain;
      data[i + 1] += grain;
      data[i + 2] += grain;
    }
  }
  ctx.putImageData(img, x - 2, y - 24);
}

// Particle-style decay
function fadeSentence(x, y, w, h) {
  const start = performance.now();
  const duration = 15000;

  const snapshot = ctx.getImageData(x, y, w, h);

  function tick(now) {
    const t = Math.min((now - start) / duration, 1);
    const d = snapshot.data;

    for (let i = 0; i < d.length; i += 4) {
      if (d[i + 3] === 0) continue;

      const survivalRate = 0.15; // ~15% pixels survive
      if (Math.random() > survivalRate) {
        if (Math.random() < t * 0.2) {
          d[i + 3] = 0; // dissolve pixel rapidly
        }
      } else {
        d[i + 3] *= 0.995; // surviving ghost slowly fades
      }

      const g = (Math.random() - 0.5) * (12 + t * 20);
      d[i] += g;
      d[i + 1] += g;
      d[i + 2] += g;

      // fade toward light gray
      const fade = t * 0.8;
      d[i] += (235 - d[i]) * fade;
      d[i + 1] += (235 - d[i + 1]) * fade;
      d[i + 2] += (235 - d[i + 2]) * fade;
    }

    ctx.putImageData(snapshot, x, y);

    if (t < 1) requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
}

// Click typing with word-wrap
canvas.addEventListener("click", (e) => {
  const text = statements[Math.floor(Math.random() * statements.length)];

  const padding = 40;
  const fontSize = parseInt(ctx.font, 10);
  const lineHeight = fontSize * 1.4;
  const maxWidth = canvas.width - padding;

  let x = padding;
  let y = e.clientY + window.scrollY;

  let minX = x;
  let minY = y - fontSize;
  let maxX = x;
  let maxY = y;

  // Split text into words, keeping spaces
  const words = text.split(/(\s+)/);
  let wordIndex = 0;

  function typeWord() {
    if (wordIndex >= words.length) {
      fadeSentence(minX - 10, minY - 10, maxX - minX + 20, maxY - minY + 20);
      return;
    }

    const word = words[wordIndex];
    const wordWidth = ctx.measureText(word).width;

    // Move to next line if needed
    if (x + wordWidth > maxWidth) {
      x = padding;
      y += lineHeight;
    }

    let charIndex = 0;
    function typeChar() {
      if (charIndex >= word.length) {
        x += 0; // spacing handled by space elements
        wordIndex++;
        setTimeout(typeWord, 0);
        return;
      }

      const char = word[charIndex];
      drawInkChar(char, x, y);
      x += ctx.measureText(char).width;
      minX = Math.min(minX, x);
      minY = Math.min(minY, y - fontSize);
      maxX = Math.max(maxX, x);
      maxY = Math.max(maxY, y);

      charIndex++;
      setTimeout(typeChar, 50);
    }

    typeChar();
  }

  typeWord();
});
